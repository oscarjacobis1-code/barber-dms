<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Work — Ismelis Styles Barbería &amp; Salón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,500;1,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .lang-btn {
    background: transparent;
    border: 1px solid currentColor;
    color: inherit;
    padding: 6px 12px;
    margin-right: 12px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 0.85rem;
    font-weight: 600;
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="nav-mark">ISMELIS STYLES</a>
    <div class="nav-links" id="navLinks">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="index.html#services" data-i18n="nav_services">Services</a>
      <a href="work.html" class="active" data-i18n="nav_work">The Work</a>
      <a href="index.html#visit" data-i18n="nav_visit">Visit</a>
      <button id="langToggle" class="lang-btn">ES</button>
      <a href="https://ismelstyles.setmore.com" data-book-link class="nav-cta" data-i18n="book_chair">Book a Chair</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span></button>
  </div>
</nav>

<section class="gallery-head wrap reveal in">
  <span class="eyebrow" data-i18n="selected_work">Selected Work</span>
  <h1 data-i18n="gallery_heading">Every fade tells<br>the same story: precision.</h1>
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all" data-i18n="filter_all">All</button>
    <button class="filter-btn" data-filter="cut" data-i18n="filter_cuts">Cuts &amp; Fades</button>
    <button class="filter-btn" data-filter="beard" data-i18n="filter_beard">Beard Work</button>
    <button class="filter-btn" data-filter="color" data-i18n="filter_color">Color &amp; Gray Blend</button>
  </div>
</section>

<section class="wrap">
  <div class="gallery-grid" id="js-gallery">
    <div class="gallery-item reveal in" data-cat="cut">
      <div class="cap">Skin Fade, Textured Top<small>Cuts &amp; Fades</small></div>
    </div>
  </div>
</section>

<section class="section dark" style="padding:80px 0;">
  <div class="wrap" style="text-align:center;">
    <span class="eyebrow" data-i18n="ready_eyebrow">Ready When You Are</span>
    <h2 style="margin-bottom:26px;" data-i18n="ready_heading">Every one of these started with a conversation.</h2>
    <a href="https://ismelstyles.setmore.com" data-book-link class="btn btn-primary" data-i18n="book_chair">Book a Chair</a>
  </div>
</section>

<div class="dark">
  <div class="footer wrap">
    <span>© 2026 Ismelis Styles Barbería &amp; Salón</span>
    <span data-i18n="by_appt">By appointment only</span>
  </div>
</div>

<script src="render.js"></script>
<script>
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => navLinks.classList.toggle('open'));

  renderWork();
</script>
</body>
</html>
